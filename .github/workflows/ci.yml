# .github/workflows/ci.yml

name: Model Sanity Check and CML Report

on:
  pull_request:
    branches: [ main ]

# ADD THIS PERMISSIONS BLOCK
permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      # MODIFY THIS STEP
      - name: Run tests and create report
        run: |
          source .venv/bin/activate
          # Run pytest and redirect all output to report.md
          # '|| true' ensures this step succeeds even if tests fail, so the report is always published.
          pytest > report.md 2>&1 || true

      # ADD THIS STEP
      - name: Set up CML
        uses: iterative/setup-cml@v2

      # ADD THIS STEP
      - name: Create CML comment on PR
        env:
          # This token is automatically provided by GitHub for authentication
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Post the content of report.md as a comment on the Pull Request
          cml comment create report.md
